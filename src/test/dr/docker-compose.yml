# Greengage 7 DR test: two single-host demo clusters in separate containers
# sharing a /archive volume (primary writes WAL there via archive_command, dr
# recovers via restore_command -- no pgBackRest/WAL-G needed).
#
#   docker compose -f src/test/dr/docker-compose.yml up --build
#   docker compose -f src/test/dr/docker-compose.yml logs -f dr     # watch the test
#   docker compose -f src/test/dr/docker-compose.yml down -v        # tear down
#
# Both services share one image (built once from the repo root). The cluster
# work is done by the per-service entrypoint scripts under ./scripts (bind-
# mounted for fast iteration without rebuilding the image).
version: "3.8"

x-gpdb: &gpdb
  build:
    context: ../../..
    dockerfile: src/test/dr/Dockerfile
  image: ${DR_IMAGE:-greengage-dr-test:latest}
  privileged: true            # sysctls + shared memory for the cluster
  init: true                  # reap the many child processes Greengage spawns
  sysctls:
    kernel.sem: "500 1024000 200 4096"
  ulimits:
    nofile: 65535
  volumes:
    - wal_archive:/archive
    - ./scripts:/dr/scripts:ro

services:
  primary:
    <<: *gpdb
    hostname: primary
    environment:
      # T6: production stamps a full-page image into every WAL record and the DR
      # compares its own page against it after redo.  With the topology redo
      # filter gone (P7) that makes the whole run a byte-level proof that the
      # replica applies production's WAL in full.  Set to '' to turn it off.
      WAL_CONSISTENCY_CHECKING: "all"
    command: ["/dr/scripts/primary-entrypoint.sh"]

  dr:
    <<: *gpdb
    hostname: dr
    depends_on:
      - primary
    command: ["/dr/scripts/dr-entrypoint.sh"]

volumes:
  wal_archive:
