# .github/workflows/claude.yml
#
# Answers when someone writes "@claude" on a pull request or issue. Nothing runs
# unprompted -- this is on-demand review, not a check on every push.
#
# The Greengage agent skills (https://github.com/GreengageDB/gg-agent) are installed
# into the run, so Claude reviews with MPP-specific knowledge -- dispatch and node
# serialization, motion and locus, distributed transactions, FTS, append-optimized
# auxiliary relations -- rather than with single-node PostgreSQL intuition.
#
# This job is NOT a required check, so it needs no branch-protection change.
#
# Setup, both of which need repository admin:
#   1. Install the Claude GitHub App on this repository.
#   2. Add the repository or organization secret ANTHROPIC_API_KEY.
#
# Try it:  comment "@claude review this for MPP correctness" on a pull request.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Repeated mentions on the same PR/issue supersede each other.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    # Only wake up when actually mentioned. Fields absent for a given event
    # evaluate to null, and contains(null, ...) is false.
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude') ||
      contains(github.event.issue.body, '@claude')

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read # review only -- Claude cannot commit
      pull-requests: write # inline comments and the summary comment
      issues: write # the action's own tracking comment
      id-token: write # required for the action's GitHub App authentication

    steps:
      - uses: actions/checkout@v6
        with:
          # Shallow on purpose: this repository's history is large and the review
          # reads the diff through `gh pr diff`, which needs no local history.
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Deliberately no `prompt:` -- supplying one would switch the action into
          # unprompted automation mode. Without it, the triggering comment is the
          # prompt and Claude waits to be mentioned.

          # Deliberately no `github_token:` -- omitting it authenticates as the Claude
          # GitHub App. Passing ${{ secrets.GITHUB_TOKEN }} would also stop GitHub from
          # triggering CI on anything Claude pushes.

          # The Greengage skills, subagents and commands. The marketplace URL must end
          # in `.git`; the action rejects owner/repo shorthand and SSH URLs.
          plugin_marketplaces: "https://github.com/GreengageDB/gg-agent.git"
          plugins: "greengage@greengage-agent-skills"

          # The inline-comment MCP server starts ONLY when claude_args names its tool,
          # so keep that first entry even though CLAUDE.md also asks for inline comments.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob,Agent,Skill"
